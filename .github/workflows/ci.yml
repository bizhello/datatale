name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          import subprocess

          roots = {"README.md", "AGENTS.md", "CLAUDE.md"}
          def documentation(path):
              return path in roots or (path.startswith("docs/") and path.endswith(".md"))

          try:
              paths = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  os.environ["BASE"], os.environ["HEAD"], "--",
              ]).decode().split("\0")
              code = any(path and not documentation(path) for path in paths)
          except (subprocess.CalledProcessError, UnicodeDecodeError):
              code = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(code).lower()}\n")
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx --no-install playwright install --with-deps chromium webkit
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  verify:
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable checks
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          test "$CLASSIFICATION" = success
          if [ "$CODE" = true ]; then
            test "$CHECKS" = success
          else
            test "$CODE" = false
            test "$CHECKS" = skipped
          fi
